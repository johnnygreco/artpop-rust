[package]
name = "artpop-service"
description = "Typed operation registry, validation, artifact store, and executor shared by the artpop-rust CLI and MCP server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
artpop-core.workspace = true
artpop-io.workspace = true
indexmap = { version = "2", features = ["serde"] }
schemars = { version = "1.2", features = ["indexmap2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
serde_path_to_error = "0.1"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
rayon = "1.12"
ureq = "3"
lzma-rust2 = "0.22"
tar = "0.4"
