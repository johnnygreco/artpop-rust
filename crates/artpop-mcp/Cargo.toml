[package]
name = "artpop-mcp"
description = "Model Context Protocol server for artpop-rust (official rmcp SDK, stdio transport)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
artpop-service.workspace = true
artpop-core.workspace = true
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io", "base64"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
base64 = "0.22"
