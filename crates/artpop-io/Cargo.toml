[package]
name = "artpop-io"
description = "File formats for artpop-rust: CSV tables, FITS images (CFITSIO), PNG previews, SVG plots"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
artpop-core.workspace = true
fitsio = { version = "0.21", features = ["fitsio-src", "src-cmake"] }
itoa = "1"
png = "0.18"
rayon = "1.12"
ryu = "1"
sha2 = "0.11"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
